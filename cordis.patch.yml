# prompt-anchor bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 prompt-anchor，不外接、不 link 其它红队包。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: Your working directory is supplied by the session runtime.

- insert:
    - id: dsh-prompt-anchor
      name: 'dsh-prompt-anchor'
      config:
        enabled: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: true

    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: prompt-anchor-redteam
      name: dsh-prompt-anchor/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: prompt-anchor-redteam-store
      name: dsh-prompt-anchor/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: prompt-anchor-redteam-ui
      name: dsh-prompt-anchor/redteam/ui
